name: WISE Walk Nightly Analytics

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 2:00 AM Dhaka time
  workflow_dispatch:        # allow manual run from the Actions tab

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run WISE analytics pipeline
        env:
          WISE_SCRIPT_URL: ${{ secrets.WISE_SCRIPT_URL }}
        run: python wise_analytics.py

      - name: Commit analytics.json
        run: |
          git config user.name "wise-walk-bot"
          git config user.email "actions@github.com"
          git add analytics/analytics.json
          git diff --cached --quiet && echo "No changes." || git commit -m "Nightly WISE analytics refresh"
          git push
